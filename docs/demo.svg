<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
  <title>jobcanary — a run against two boards, one of which is down</title>
  <desc>Terminal recording: jobcanary run polls two Workday boards, one returns two postings and one fails with HTTP 503, then the resulting Markdown digest is shown.</desc>

  <style>
    .bg   { fill: #12141a; }
    .bar  { fill: #1c1f27; }
    .txt  { fill: #d6dae3; white-space: pre; }
    .dim  { fill: #7b8496; }
    .grn  { fill: #7fd88f; }
    .yel  { fill: #e5c07b; }
    .red  { fill: #e08c7d; }
    .cyn  { fill: #6cb6d9; }
    .mag  { fill: #c3a0e0; }
    .ttl  { fill: #8b93a4; font-size: 11.5px; }

    /* Each line fades in on its own beat, then the whole cast loops. */
    .l { opacity: 0; animation: appear 14s linear infinite; }
    @keyframes appear { 0%, 3% { opacity: 0 } 5%, 96% { opacity: 1 } 100% { opacity: 1 } }

    .d1  { animation-delay: 0.0s }
    .d2  { animation-delay: 0.9s }
    .d3  { animation-delay: 1.5s }
    .d4  { animation-delay: 2.1s }
    .d5  { animation-delay: 2.6s }
    .d6  { animation-delay: 3.4s }
    .d7  { animation-delay: 4.2s }
    .d8  { animation-delay: 4.6s }
    .d9  { animation-delay: 5.0s }
    .d10 { animation-delay: 5.4s }
    .d11 { animation-delay: 5.8s }
    .d12 { animation-delay: 6.2s }
    .d13 { animation-delay: 6.6s }
    .d14 { animation-delay: 7.0s }
    .d15 { animation-delay: 7.4s }
    .d16 { animation-delay: 7.8s }
    .d17 { animation-delay: 8.2s }
    .d18 { animation-delay: 8.6s }
    .d19 { animation-delay: 9.0s }

    .cursor { animation: blink 1.1s step-end infinite; fill: #d6dae3; }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .l { opacity: 1; animation: none }
      .cursor { animation: none }
    }
  </style>

  <rect class="bg" width="760" height="470" rx="8"/>
  <rect class="bar" width="760" height="30" rx="8"/>
  <rect class="bar" y="20" width="760" height="10"/>
  <circle cx="18" cy="15" r="5" fill="#e06c62"/>
  <circle cx="36" cy="15" r="5" fill="#e5c07b"/>
  <circle cx="54" cy="15" r="5" fill="#7fd88f"/>
  <text class="ttl" x="380" y="19" text-anchor="middle">jobcanary</text>

  <g class="txt">
    <!-- the command -->
    <text class="l d1" x="18" y="56"><tspan class="grn">$</tspan> jobcanary run --config jobcanary.yaml</text>

    <!-- real stdout/stderr from a run against two boards -->
    <text class="l d2" x="18" y="80"><tspan class="cyn">[vantor]</tspan> 2 posting(s)</text>
    <text class="l d3" x="18" y="98"><tspan class="red">[zenith]</tspan> failed: workday tenant 'zenith' returned HTTP 503</text>
    <text class="l d4" x="18" y="116">scanned=2 seen=0 excluded=0 kept=2 enrichmentFetches=2 siteErrors=1</text>
    <text class="l d5" x="18" y="134"><tspan class="dim">wrote digests/2026-08-20.md</tspan></text>

    <!-- the digest it produced -->
    <text class="l d6" x="18" y="170"><tspan class="grn">$</tspan> cat digests/2026-08-20.md</text>

    <text class="l d7"  x="18" y="196"><tspan class="mag"># Job Picks — 2026-08-20</tspan></text>
    <text class="l d8"  x="18" y="214"><tspan class="dim">**Scanned:** 2 · **New:** 2</tspan></text>

    <text class="l d9"  x="18" y="244"><tspan class="yel">### [9/10]</tspan> Graduate Simulation Engineer · Vantor Propulsion</text>
    <text class="l d10" x="18" y="262">- <tspan class="dim">**Location:**</tspan> Bicester, United Kingdom</text>
    <text class="l d11" x="18" y="280">- <tspan class="dim">**Fit:**</tspan> Matched configured keywords: graduate, simulation.</text>
    <text class="l d12" x="18" y="298">- <tspan class="dim">**Notes:**</tspan> <tspan class="yel">Requires GT-SUITE — matches your toolchain</tspan></text>
    <text class="l d13" x="18" y="316">- <tspan class="dim">**Link:**</tspan> <tspan class="cyn">https://vantor.wd3.myworkdayjobs.com/…_R-1002</tspan></text>

    <text class="l d14" x="18" y="346"><tspan class="yel">### [5/10]</tspan> Thermal Systems Engineer · Vantor Propulsion</text>
    <text class="l d15" x="18" y="364">- <tspan class="dim">**Fit:**</tspan> Matched configured keywords: thermal, gt-suite.</text>
    <text class="l d16" x="18" y="382">- <tspan class="dim">**Link:**</tspan> <tspan class="cyn">https://vantor.wd3.myworkdayjobs.com/…_R-1001</tspan></text>

    <text class="l d17" x="18" y="412"><tspan class="mag">## Site errors</tspan></text>
    <text class="l d18" x="18" y="430">- <tspan class="red">zenith — workday tenant 'zenith' returned HTTP 503</tspan></text>

    <text class="l d19" x="18" y="456"><tspan class="grn">$</tspan> <tspan class="cursor">▋</tspan></text>
  </g>
</svg>
